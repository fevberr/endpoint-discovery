[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endpoint-discovery"
version = "1.0.0"
description = "Static endpoint and web reconnaissance framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
endpoint-discovery = "_launcher:main"

[tool.setuptools]
py-modules = ["_launcher"]
packages = []

[tool.pytest.ini_options]
testpaths = ["0009"]
python_files = ["*.py"]
python_classes = ["Test*", "_*"]
python_functions = ["test_*", "_*"]
addopts = "--import-mode=importlib"